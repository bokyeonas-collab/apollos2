<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/aistudio/favicon_b36cafcc.png" />
    <link rel="shortcut icon" href="/assets/aistudio/favicon_b36cafcc.png" />
    <link rel="apple-touch-icon" href="/assets/aistudio/favicon_b36cafcc.png" />

    <!-- Primary Meta Tags -->
    <title>아볼로 | APOLLOS</title>
    <meta name="title" content="아볼로 | APOLLOS" />
    <meta name="description" content="오늘의 신앙, 오늘의 언어로 - 시대의 질문 앞에서 서로의 언어를 배우다" />

    <!-- Open Graph / KakaoTalk / Facebook / Slack / Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="아볼로 | APOLLOS" />
    <meta property="og:title" content="아볼로 | APOLLOS" />
    <meta property="og:description" content="오늘의 신앙, 오늘의 언어로 - 시대의 질문 앞에서 서로의 언어를 배우다" />
    <meta property="og:url" content="https://theapollos.org" />
    <!-- KakaoTalk scraper strictly requires absolute URL (https://) -->
    <meta property="og:image" content="https://theapollos.org/og-image.png" />
    <meta property="og:image:secure_url" content="https://theapollos.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="아볼로 | APOLLOS" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="아볼로 | APOLLOS" />
    <meta name="twitter:description" content="오늘의 신앙, 오늘의 언어로 - 시대의 질문 앞에서 서로의 언어를 배우다" />
    <meta name="twitter:image" content="https://theapollos.org/og-image.png" />

    <!-- Dynamic Origin Fallback for in-app webviews -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && !origin.includes('localhost')) {
            var fullOgImg = origin + '/og-image.png';
            var metaOg = document.querySelector('meta[property="og:image"]');
            if (metaOg) metaOg.setAttribute('content', fullOgImg);
            var metaOgSec = document.querySelector('meta[property="og:image:secure_url"]');
            if (metaOgSec) metaOgSec.setAttribute('content', fullOgImg);
            var metaTw = document.querySelector('meta[name="twitter:image"]');
            if (metaTw) metaTw.setAttribute('content', fullOgImg);
            var metaUrl = document.querySelector('meta[property="og:url"]');
            if (metaUrl) metaUrl.setAttribute('content', window.location.href);
          }
        } catch(e) {}
      })();
    </script>

    <!-- Typography: Cormorant Garamond (Serif), Caveat (Script), Pretendard (Korean Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-[#FBF9F4] text-[#4A4A48] antialiased selection:bg-[#3B5E43]/15 selection:text-[#1D1D1D]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
